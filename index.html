<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Final Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Final Grade Calculator</h1>
        <p>Dynamically calculate what you need on your final exam.</p>
        
        <form id="grade-form">
            <div class="top-fields">
                <div class="input-group">
                    <label for="target-grade">Target Grade (%)</label>
                    <input type="number" id="target-grade" placeholder="e.g., 90" required min="0" max="150">
                </div>
                <div class="input-group">
                    <label for="extra-credit">Extra Credit (%)</label>
                    <input type="number" id="extra-credit" placeholder="e.g., 2" min="0" value="0">
                </div>
            </div>

            <div id="sections-container"></div>

            <div class="grade-section final-section">
                <h3>Final Exam</h3>
                <div class="section-row">
                    <span class="disabled-input">Final Exam Score Needed</span>
                    <div class="input-unit">
                        <input type="number" id="final-weight" placeholder="Weight" required min="0" max="100">
                        <span class="unit-label">%</span>
                    </div>
                </div>
            </div>

            <button type="button" class="btn-calculate" onclick="calculateGrade()">Calculate Required Score</button>
        </form>

        <div id="result" class="result-box hidden">
            <h2>You need a <span id="required-score">0</span>% on the final exam.</h2>
            <p id="result-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
